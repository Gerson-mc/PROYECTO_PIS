<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AyudaYa - Iniciar Sesión</title>
  <!-- Iconos de Bootstrap para el ojito y el sol/luna -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Botón flotante para cambiar de Tema (Claro / Oscuro) -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
    <i id="theme-icon" class="bi bi-moon-stars-fill"></i>
  </button>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <h2>🐾 AyudaYa</h2>
        <p>Sistema de Gestión de Mascotas</p>
      </div>

      <form id="form-login">
        <div class="form-group">
          <label for="usuario">Usuario / Login</label>
          <input type="text" id="usuario" name="usuario" placeholder="Ej. juan.perez" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" id="toggle-password" class="btn-eye" aria-label="Mostrar contraseña">
              <i id="eye-icon" class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
      </form>

      <div id="mensaje-error" class="error-msg" style="display: none;"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
